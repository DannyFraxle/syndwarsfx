; FX3D Lighting Configuration
; Edit and re-run the game; no recompile needed.  Lines beginning with ; are comments.

; --- Global lighting controls ---------------------------------------------
; intensity : post-sqrt brightness scale, percent 0-200.
;             Raw inverse-square contribs are accumulated, sqrt-compressed, then
;             scaled by this value before adding the sun base.
;             17 = streetlamps at close range hit 1.0 (texture overblown/glow).
;             10 = pools visible but no overbright.  30 = most areas hit 1.0.
;             0 = lamps off entirely.  Does NOT affect ambient or sun base.
; radius    : INVERSE-SQUARE ATTENUATION SCALE.
;             Scales the constant in the inverse-square falloff formula:
;               contrib = Intensity * 34019 * (radius/21) / (dist2+1)
;             radius=21 (= the old default) reproduces the SW engine's exact
;             super-quick-light formula.  radius=10 halves brightness everywhere.
;             radius=42 doubles it.  Linear in effect, unlike the old pool-radius.
; shadow    : darkening strength for the original engine's negative-Intensity "anti-
;             lights" (fake contact shadows projected under buildings by the SW engine).
;             0 = ignore them entirely, 1 = original strength, 2 = twice as dark.
; ambient   : floor brightness in areas with no lamps and sun disabled, 0.0-1.0.
;             Lower = more contrast between light pools and dark gaps.
;             0.0 = pure black between pools.
;             When sun is enabled this is overridden by the sun brightness/ambient.
; tint      : global colour cast applied to all lamp light, R G B (0-255).
;             255 255 255 = pure white (no cast).  255 240 200 = warm yellow.
;             200 215 255 = cool blue.  Affects lamps only, not the sun base.
; ao        : per-vertex geometric occlusion strength, percent 0-100.
;             100 = full per-tile ambient variation (floor dims at building bases).
;             0 = flat ambient everywhere (no per-tile base variation).
;
; --- Lighting model: inverse-square additive + sqrt compression + per-pixel distance cull ---
; The HW renderer accumulates raw inverse-square per-light contributions
; (no per-light clamp — close lights contribute 33+, creating visible
; hotspot "burn"), then applies sqrt compression to preserve variation,
; then scales by the intensity/gain:
;   contrib = ar / (dist2 + 1)                  (raw inverse-square)
;   light_col += uLightRgb[i] * contrib         (additive accumulation)
;   light_col = sqrt(light_col)                 (sqrt compression, no hard clamp)
;   light_col = light_col * (intensity/100) + (sun_base or 0)   (scale + base)
;   light_col = max(light_col, 0)               (allow >1.0 for overbright glow)
; Each pixel independently skips lights beyond max_light_dist tiles (per-pixel
; distance culling — no camera-based pop-in). This keeps light pools tight
; and dark gaps deep, even with 64 lights in the uniform.
; Close lights produce a bright core (hotspot), moderate overlap adds
; brightness, no-light areas can be truly dark (ambient=0). The sqrt
; preserves variation across the whole range.
;
; max_light_dist : per-pixel distance cull radius in game tiles (1-30).
;                  8  = tight pools, deep dark gaps (default).
;                  10 = wider pools, moderate gaps.
;                  15 = very wide pools, shallow gaps.
;                  30 = effectively unlimited (64-light sum floods everything).
;
; --- Per-category brightness (Intensity-based) ----------------------------
; Lights are divided into three categories by their Intensity value:
;   filler   : Intensity <= filler_maxint     — small ambient fill lights
;   building : filler_maxint < Intensity <= building_maxint — building/object lights
;   street   : Intensity > building_maxint   — main street lamps
; Each category has its own brightness multiplier, stacked on top of the global
; intensity and per-ID brightness.
;
; filler_brightness    = 0.0   (fillers OFF)
; building_brightness   = 0.3   (buildings at 30% — dim building pools)
; street_brightness     = 1.5   (streetlamps at 150% — bright glow spots)
; filler_maxint         = 50    (Intensity <= 50 = filler)
; building_maxint       = 200   (Intensity <= 200 = building)
;                                (Intensity > 200 = street)
[defaultlighting]
intensity          = 100
radius             = 8
shadow             = 1.0
ambient            = 1.00
tint               = 255 250 240
ao                 = 300
face_ao            = 90
shade_sat          = 100
shadow_depth       = 80
max_light_dist     = 10
filler_brightness  = 1.00
building_brightness = 1.00
street_brightness  = 1.00
filler_radius      = 10
building_radius    = 2
street_radius      = 13
filler_maxint      = 50
building_maxint    = 200
thingno_debug      = 0

[sun]
enable     = 0
brightness = 0.35
ambient    = 0.05
azimuth    = 360
auto_azimuth = 1
elevation  = 45
softness   = 12
bias       = 0.0005
slope      = 2.0
units      = 4.0
haze       = 0.30
debug      = 0
[ssao]
enable   = 1
radius   = 0.200
world    = 768
strength = 2.0
bias     = 64
debug    = 0
[fx3d_lights]
brightness_debug = 0

[thing_categories]
; type:subtype = category  (0=unset 1=filler 2=building 3=street)
5:1 = 3
5:2 = 2

[sprites]
xbr_scale = 2
sprite_debug = 0
; persp_strength: how much billboards (people/lamps/bodies) shrink/grow with
; DISTANCE. 0 = flat with distance (matches the original SW blit, which had no
; distance term); 1 = full uncancelled 3D perspective. Tune LIVE, no rebuild.
persp_strength = 0.3
; persp_zoom_ref: makes sprites shrink/grow with ZOOM, in lockstep with the
; floor (the SW blit scaled sprites by overall_scale). This is the UNSCALED
; zoom value (resolution-independent: the code strips out the screen-height/240
; hi-res multiplier before comparing) at which sprite size is nominal/"correct".
; To calibrate: read the KP-7 debug dump's 'scale=' at your usual in-game zoom,
; then divide by (min(screen_w,screen_h)/240) — e.g. scale=702 at 1920x1080
; (h/240=4.5) gives persp_zoom_ref=156. Once set, this value stays correct
; across any ResGameHi/ResGameLo resolution change; no need to retune per-res.
; Lower it to make sprites bigger overall, raise it to make them smaller; 0
; disables zoom scaling (old behaviour: sprites never shrank on zoom).
; Tune LIVE, no rebuild.
persp_zoom_ref = 156
; persp_max_scale: hard ceiling on the perspective-cancel multiplier (as a
; multiple of the zoom base). The cancel term divides by (16384-scrd)/16384,
; which collapses toward its divide-guard floor for far/edge-of-range sprites and
; without a ceiling produces a ~14x scale spike (the "giant sprite" glitch). 3.0
; keeps normal near/far scaling untouched while bounding the spike. 0 = no cap.
; Tune LIVE, no rebuild.
persp_max_scale = 3.0

[transparency]
; Phase 8 - semi-transparent rendering.
; enable: 1 = draw deep-radar see-through buildings and glass/fence faces blended.
; alpha:  blended face opacity, 0.0 (invisible) .. 1.0 (opaque). Default 0.5.
; sprite_enable: 1 = draw translucent sprites (light/glow halos) in a blended pass.
; sprite_alpha:  translucent sprite opacity, 0.0 .. 1.0. 1.0 = unchanged look.
enable = 1
alpha = 0.5
sprite_enable = 1
sprite_alpha = 0.8
debug = 0

[glare]
; Vehicle headlamp and police siren glow billboard settings.
;
; *_width : billboard size multiplier applied to each glare's world-space radius.
;           Higher = wider glow disc on screen.  Default 6.5.
; *_alpha : glow texture intensity (brightness) for each colour.
;           1.0 = subtle,  3.5 = moderate,  5.5 = vivid.
;           Headlamps should be lower than sirens so they read as plain white.
;           NOTE: the glow texture is generated once on first use per session.
;           Changes here take effect on the next game launch.
headlamp_width = 6.0
red_width      = 6.5
blue_width     = 6.5
headlamp_alpha = 1.5
red_alpha      = 4.0
blue_alpha     = 6.0

[firelight]
; Ground fires (napalm, burning things) cast a flickering warm point light on
; the floor and nearby objects, matching the software renderer's dynamic
; apply_full_light glow. The flames' own billboards are self-lit and cast no
; light, so this pass adds the illumination. One light is emitted per burning
; map tile (a fire's many flames are merged), distance-culled to ~16 tiles.
;
; enable     : 1 = fires emit ground light, 0 = off (flames stay self-lit only).
; brightness : RGB gain for the warm pool.  1.6 = default.
; radius     : reach multiplier (21 convention, same as street_radius).
;              11 ~= 5.7 tile pool; raise for a wider glow.
; flicker    : flame flicker depth, 0..1.  0 = steady, 0.3 = default shimmer.
; cluster    : flame merge radius in tiles.  All flames within this distance
;              collapse into ONE light, so a single fire (its ~20 flames spread
;              over ~2 tiles) and neighbouring fires become one light instead of
;              many.  3 = default; raise to merge more aggressively (fewer lights).
; min_flames : a cluster needs at least this many flames to emit a light.  1 =
;              light every fire (default).  Raise it (e.g. 25) to skip small or
;              lone fires and only light real blazes — saves light-budget slots.
enable     = 1
brightness = 1.5
radius     = 10
flicker    = 0.2
cluster    = 3
min_flames = 1

[persuadelight]
; People converted by the persuadertron carry the same internal flag as a person
; who is on fire (TngF_Unkn40000000, set by set_person_persuaded), so they used
; to emit the orange flickering fire light and glow like a torch.  The fire light
; is now suppressed for them, and a cold turquoise pool plays for the duration of
; the conversion itself (PerSt_BEING_PERSUADED, ~3s) - once they are yours they
; light nothing.  Clustered like fires, so a group conversion is one pool.
;
; enable     : 1 = people being persuaded cast a ground light, 0 = off.
; brightness : RGB gain.  0.8 = default (half the fire light's gain).
; radius     : reach multiplier (21 convention).  8 = default, a tighter pool
;              than a fire.
; pulse      : slow breathing depth, 0..1.  0 = dead steady, 0.15 = default.
; cluster    : merge radius in tiles; people being converted within this distance
;              collapse into one light.  2 = default.
; colour_*   : the light colour, normalized 0..1.  Default is turquoise.
enable     = 1
brightness = 0.8
radius     = 8
pulse      = 0.15
cluster    = 2
colour_r   = 0.10
colour_g   = 0.95
colour_b   = 0.85

[rain]
; Procedural rain overlay, drawn as its own alpha-blended GL pass (screen-space
; streaks) instead of the software renderer's opaque pixel-block rain, which
; the GL keyed composite could only draw fully solid over the 3D scene.
;
; enable  : 1 = draw the GL rain overlay while it's raining, 0 = no rain shown.
; alpha   : streak opacity, 0.0 (invisible) .. 1.0 (opaque). Default 0.35.
; density : streak columns per screen-height of width. Higher = more streaks.
; speed   : fall speed in screen-heights/second. Default 0.6.
; width   : streak thickness in pixels. Lower = thinner lines. Default 1.5.
; length  : streak length as a fraction of screen height, 0..1. Default 0.05.
; angle   : wind slant in degrees, 0 = straight down. Default 0.
enable  = 1
alpha   = 0.35
density = 600
speed   = 2.5
width   = 1.0
length  = 0.05
angle   = 0

[fog]
; Distance fog / weather haze, drawn as an alpha-blended GL pass together with
; the rain (only while it's actually raining). Far geometry fades toward the
; fog colour so the street disappears into mist off in the distance.
;
; Distance comes from the SSAO/water G-buffer's world-position buffer when that
; composite path is on ([ssao] enable = 1 or [water] reflect_enable = 1), which
; gives true per-pixel depth. When it is off there is no depth to sample, so the
; pass falls back to a screen-space vertical gradient (scr_start/scr_end); the
; fixed camera tilt makes screen Y a decent stand-in for distance, at the cost
; of over-fogging the tops of tall nearby buildings.
;
; enable    : 1 = draw the haze while raining, 0 = clear air.
; colour_*  : haze tint, 0..1 each. Default cool grey 0.55/0.58/0.62.
; density   : maximum fog opacity at full distance, 0..1. Default 0.55.
; start/end : view-depth ramp in world units (G-buffer mode). View depth is 0 at
;             the screen-centre look-at point and grows into the distance, so
;             start = 0 keeps the near half of the screen clear and hazes up
;             beyond mid-screen; end is where the haze reaches full density.
;             Negative start pulls the haze NEARER than mid-screen — make it
;             more negative to bring the fog further forward, less (toward 0
;             or above) to push it back into the distance.
;             Defaults -1500 / 6000. (Distance from the camera EYE is not used: the
;             eye sits ~16384 units behind the centre, and that offset swamps
;             the on-screen depth spread into one flat shade of grey.)
; scr_start : fallback screen-Y where the haze reaches full density, 0 = top of
;             the screen. Default 0.0.
; scr_end   : fallback screen-Y where the haze fades out entirely (below this
;             the air is clear). Default 0.55.
enable    = 1
colour_r  = 0.55
colour_g  = 0.58
colour_b  = 0.62
density   = 0.55
start     = -1500
end       = 6000
scr_start = 0.0
scr_end   = 0.55

[bullettime]
; Bullet-time slow-motion on big explosions: dips the simulation speed and
; draws a real radial "zoom blur" (grows from a sharp centre toward blurred
; edges) plus a motion-trail/ghosting blend with the previous frame, so it
; reads as a deliberate effect rather than a hitch. Triggered from
; do_shockwave() (rockets, mines, building demolitions); plain bullet-impact
; ground hits use a small fixed intensity and stay below min_intensity, so
; gunfire alone won't trigger it. The trigger is gated by proximity to the
; camera view (range_tiles), not by any particular agent's position.
;
; enable        : 1 = slow the sim and draw the screen filter on big
;                 explosions, 0 = off entirely.
; scale         : world speed multiplier while fully dipped, e.g. 0.66 = 2/3
;                 speed. Lower = deeper slow-motion.
; hold_ms       : milliseconds held at full dip before easing back (2500).
; ramp_ms       : milliseconds spent easing back to normal speed (1500) - a
;                 long ramp reads as a slow recovery rather than a snap back.
; min_intensity : do_shockwave() intensity threshold that triggers the
;                 effect. Plain bullet ground hits pass 1; real explosions
;                 pass 100-5000+. Raise to only trigger on the biggest blasts.
; range_tiles   : max distance, in map tiles, from the current camera/view
;                 centre an explosion can be and still trigger the effect.
;                 Keeps it from firing for explosions off-screen elsewhere on
;                 the map. 0 = unlimited (intensity gate only).
; blur_strength : max radial-blur reach at the screen edge (UV units) at full
;                 dip. 0 = no blur. Try 0.03 (subtle) .. 0.12 (strong).
; trail         : motion-trail/ghosting strength at full dip, 0..1 - how much
;                 of the previous frame blends into this one. 0 = no trail.
enable        = 1
scale         = 0.66
hold_ms       = 2500
ramp_ms       = 1500
min_intensity = 100
range_tiles   = 20
blur_strength = 0.06
trail         = 0.4

[water]
; Water floor tiles. Two effects:
;  - seamless tiling: the water texture is sampled from continuous world-space
;    UVs instead of each tile clamping its own sub-rect, removing the hard seams
;    that showed at every tile boundary (most visible because water animates).
;    Always on for water tiles; no toggle (it's the correct mapping).
;  - shine: the software renderer's water "shine" - a wobble-driven brightness
;    (ReflShade = (wobble+32)<<9, folded into the per-corner shade and Gouraud-
;    interpolated) that drifts smoothly across the surface as the wave animates.
;
; enable         : 1 = add the wobble-driven shine to water, 0 = flat water.
; shine_strength : scales the moving wobble component. 1.0 = software-exact.
;                  Higher = stronger/brighter drifting blobs; 0 behaves like
;                  enable = 0.
;
; reflect_enable   : 1 = screen-space reflection on water - the composite pass
;                    ray-marches reflections of the surrounding scene off the
;                    water and falls back to reflect_sky where a ray leaves the
;                    screen or hits nothing. Turning this on forces the G-buffer/
;                    composite path on even if [ssao] enable = 0 (AO stays 1.0),
;                    so reflections work regardless of the SSAO setting.
; reflect_strength : reflection blend, 0..1. Mild (0.25) keeps it subtle.
; reflect_sky      : R G B (0..1) reflected where there is no geometry - a dark
;                    blue/grey reads as an overcast sky.
enable           = 1
shine_strength   = 1.0
reflect_enable   = 1
reflect_strength = 0.25
reflect_sky      = 0.10 0.13 0.18
; reflect_blur  : blur reach in pixels applied to the reflection. The ray hit test
;                 is binary per pixel, so without this the reflection has hard
;                 polygon edges; blurring the result smooths it into a watery
;                 reflection (wider vertically, as real water smears). 0 = sharp.
; reflect_debug : 1 = colour the water by why each pixel's reflection ray ended,
;                 for diagnosing cutoffs. green = hit geometry, red = ray went
;                 behind the camera, blue = ray left the screen, magenta = hit but
;                 too far behind the surface, yellow = ran out of march steps.
reflect_blur     = 2.0
reflect_debug    = 0

; ---------------------------------------------------------------------------
[floor]
; no_surface_tiles - what to do with map cells that have no ground surface
;   (Texture == 0: a wall or ledge stands there, not floor).
;   Such a cell's four grid corners straddle the top and bottom of the drop, so
;   its floor quad is a steep ramp. The software renderer has that ramp too, but
;   hides it by pushing the tile to the back of the painter's-order bucket so the
;   wall faces paint over it. A z-buffer cannot do that - the ramp intersects the
;   wall and pokes out, chamfering ledge corners that should be square.
;     0 = skip the tile entirely (default; wall faces already cover the ground)
;     1 = draw it as the software renderer's flat colour_grey2 polygon
;     2 = draw it with the nearest floor neighbour's texture (old behaviour)
no_surface_tiles = 0

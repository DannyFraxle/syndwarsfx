; FX3D Lighting Configuration
; Edit and re-run the game; no recompile needed.  Lines beginning with ; are comments.

; --- Global lighting controls ---------------------------------------------
; intensity : post-sqrt brightness scale, percent 0-200.
;             Raw inverse-square contribs are accumulated, sqrt-compressed, then
;             scaled by this value before adding the sun base.
;             17 = streetlamps at close range hit 1.0 (texture overblown/glow).
;             10 = pools visible but no overbright.  30 = most areas hit 1.0.
;             0 = lamps off entirely.  Does NOT affect ambient or sun base.
; radius    : INVERSE-SQUARE ATTENUATION SCALE.
;             Scales the constant in the inverse-square falloff formula:
;               contrib = Intensity * 34019 * (radius/21) / (dist2+1)
;             radius=21 (= the old default) reproduces the SW engine's exact
;             super-quick-light formula.  radius=10 halves brightness everywhere.
;             radius=42 doubles it.  Linear in effect, unlike the old pool-radius.
; shadow    : darkening strength for the original engine's negative-Intensity "anti-
;             lights" (fake contact shadows projected under buildings by the SW engine).
;             0 = ignore them entirely, 1 = original strength, 2 = twice as dark.
; ambient   : floor brightness in areas with no lamps and sun disabled, 0.0-1.0.
;             Lower = more contrast between light pools and dark gaps.
;             0.0 = pure black between pools.
;             When sun is enabled this is overridden by the sun brightness/ambient.
; tint      : global colour cast applied to all lamp light, R G B (0-255).
;             255 255 255 = pure white (no cast).  255 240 200 = warm yellow.
;             200 215 255 = cool blue.  Affects lamps only, not the sun base.
; ao        : per-vertex geometric occlusion strength, percent 0-100.
;             100 = full per-tile ambient variation (floor dims at building bases).
;             0 = flat ambient everywhere (no per-tile base variation).
;
; --- Lighting model: inverse-square additive + sqrt compression + per-pixel distance cull ---
; The HW renderer accumulates raw inverse-square per-light contributions
; (no per-light clamp — close lights contribute 33+, creating visible
; hotspot "burn"), then applies sqrt compression to preserve variation,
; then scales by the intensity/gain:
;   contrib = ar / (dist2 + 1)                  (raw inverse-square)
;   light_col += uLightRgb[i] * contrib         (additive accumulation)
;   light_col = sqrt(light_col)                 (sqrt compression, no hard clamp)
;   light_col = light_col * (intensity/100) + (sun_base or 0)   (scale + base)
;   light_col = max(light_col, 0)               (allow >1.0 for overbright glow)
; Each pixel independently skips lights beyond max_light_dist tiles (per-pixel
; distance culling — no camera-based pop-in). This keeps light pools tight
; and dark gaps deep, even with 64 lights in the uniform.
; Close lights produce a bright core (hotspot), moderate overlap adds
; brightness, no-light areas can be truly dark (ambient=0). The sqrt
; preserves variation across the whole range.
;
; max_light_dist : per-pixel distance cull radius in game tiles (1-30).
;                  8  = tight pools, deep dark gaps (default).
;                  10 = wider pools, moderate gaps.
;                  15 = very wide pools, shallow gaps.
;                  30 = effectively unlimited (64-light sum floods everything).
;
; --- Per-category brightness ----------------------------------------------
; Category is normally determined by the LightHead-connected Thing's
; (Type,SubType) mapping from [thing_categories].  When ownership cannot
; be determined (no SimpleThing traces to the light), the fallback uses
; Intensity thresholds:
;   filler   : Intensity <= filler_maxint
;   building : filler_maxint < Intensity <= building_maxint
;   street   : Intensity > building_maxint
; Each category has its own brightness multiplier.
;
; filler_brightness    = 0.0   (fillers OFF)
; building_brightness   = 0.3   (buildings at 30% — dim building pools)
; street_brightness     = 1.5   (streetlamps at 150% — bright glow spots)
; filler_maxint         = 50    (fallback: Intensity <= 50 = filler)
; building_maxint       = 200   (fallback: Intensity <= 200 = building)
;                                (fallback: Intensity > 200 = street)
[defaultlighting]
intensity          = 100
radius             = 21
shadow             = 2.0
ambient            = 0.0
tint               = 255 255 255
ao                 = 100
max_light_dist     = 8
filler_brightness  = 0.0
building_brightness = 0.3
street_brightness  = 1.5
filler_radius      = 21
building_radius    = 1.5
street_radius      = 21
filler_maxint      = 50
building_maxint    = 200
thingno_debug      = 0
xbr_scale         = 2

; --- Screen-space ambient occlusion ----------------------------------------
; Computes real per-frame AO from scene geometry (works with destructible buildings).
; enable   : 1 = run the AO pipeline, 0 = disabled (saves GPU cost).
; radius   : screen-space sample reach in UV units (0.005 = tight, 0.04 = wide).
; world    : world-unit distance a neighbour must be within to count as an occluder
;            (256 = 1 tile).  Lower = only very close surfaces cast AO.
; strength : darkening multiplier on the computed AO factor.  1.0 = subtle,
;            2.0 = moderate, 4.0+ = very heavy contact shadows.
; bias     : minimum height difference (world units, 256 = 1 tile) a surface must
;            rise above its neighbour to cast AO.  Raise to ignore gentle floor
;            undulation and only catch ledges/steps.
; debug    : 0 = final composited image.  1 = world-position G-buffer.
;            2 = raw AO factor.  3 = blurred AO factor.
[ssao]
enable   = 0
radius   = 0.02
world    = 768
strength = 2.0
bias     = 64
debug    = 0

; --- Sun shadow map -------------------------------------------------------
; Renders scene depth from the sun direction each frame into a 2048x2048 shadow map.
; Each floor/face fragment is projected into sun-space and its depth compared to
; determine lit vs shadowed.
;
; enable     : 1 = render shadow map and use sun for base lighting.
;              0 = disabled; base lighting comes from [defaultlighting] ambient only.
; brightness : lit-ground brightness level when in direct sunlight (0.0-1.0).
;              0.10 = dim overcast.
; ambient    : floor brightness inside cast shadows (0.0-1.0).
;              0.02 = subtle shadow base.
; azimuth    : compass bearing the sun shines FROM, in degrees.
;              315 = north-west.
; elevation  : sun angle above the horizon in degrees (0-90).
;              38 = low sun, long shadows.
; softness   : PCF shadow kernel half-radius in texels (0-12).
;              2 = 5x5 Gaussian-weighted.
; bias       : tiny constant depth offset applied in the shadow comparison.
;              Default 0.0005 is a safe starting point.
; slope      : glPolygonOffset factor for grazing-angle acne suppression.
; units      : glPolygonOffset units constant depth-unit bias in shadow FBO.
; haze       : atmospheric scatter / shadow softness blending, 0.0-1.0.
;              0.0 = crisp shadow edges.
; debug      : 1 = show greyscale lit/shadow factor overlay for calibration.
[sun]
enable     = 1
brightness = 0.10
ambient    = 0.02
azimuth    = 315
elevation  = 38
softness   = 2
bias       = 0.002
slope      = 2.0
units      = 4.0
haze       = 0.0
debug      = 0

; --- Per-lamp-type colours -------------------------------------------------
; Maps FullLight.Command values (the game's lamp type IDs) to RGB colour, a
; per-type pool-size scale, and an independent brightness multiplier.
;
; Format:  <command_id> = <R> <G> <B> <radius_scale> <brightness>
;   R/G/B        : 0-255 colour of this lamp type.
;   radius_scale : inverse-square attenuation scale multiplier (1.0 = SW default)
;   brightness   : brightness multiplier (1.0 = default, 0.0 = invisible, 2.0 = 2x)
; Unrecognised command IDs default to white (255 255 255) at scale 1.0 / brightness 1.0.
;
; brightness_debug : 1 = write fx3d_light_ids.txt with all IDs in current level.
[fx3d_lights]
brightness_debug = 0

[transparency]
; Phase 8 - semi-transparent rendering.
; enable: 1 = draw deep-radar see-through buildings and glass/fence faces blended.
; alpha:  blended face opacity, 0.0 (invisible) .. 1.0 (opaque). Default 0.5.
; sprite_enable: 1 = draw translucent sprites (light/glow halos) in a blended pass.
; sprite_alpha:  translucent sprite opacity, 0.0 .. 1.0. 1.0 = unchanged look.
enable = 1
alpha = 0.5
sprite_enable = 1
sprite_alpha = 0.85
debug = 0

[glare]
; Vehicle headlamp and police siren glow billboard settings.
;
; *_width : billboard size multiplier applied to each glare's world-space radius.
;           Higher = wider glow disc on screen.  Default 6.5.
; *_alpha : glow texture intensity (brightness) for each colour.
;           1.0 = subtle,  3.5 = moderate,  5.5 = vivid.
;           Headlamps should be lower than sirens so they read as plain white.
;           NOTE: the glow texture is generated once on first use per session.
;           Changes here take effect on the next game launch.
headlamp_width = 6.5
red_width      = 6.5
blue_width     = 6.5
headlamp_alpha = 1.0
red_alpha      = 3.5
blue_alpha     = 5.5

[firelight]
; Ground fires (napalm, burning things) cast a flickering warm point light on
; the floor and nearby objects, matching the software renderer's dynamic
; apply_full_light glow. The flames' own billboards are self-lit and cast no
; light, so this pass adds the illumination. One light is emitted per burning
; map tile (a fire's many flames are merged), distance-culled to ~16 tiles.
;
; enable     : 1 = fires emit ground light, 0 = off (flames stay self-lit only).
; brightness : RGB gain for the warm pool.  1.6 = default.
; radius     : reach multiplier (21 convention, same as street_radius).
;              11 ~= 5.7 tile pool; raise for a wider glow.
; flicker    : flame flicker depth, 0..1.  0 = steady, 0.3 = default shimmer.
; cluster    : flame merge radius in tiles.  All flames within this distance
;              collapse into ONE light, so a single fire (its ~20 flames spread
;              over ~2 tiles) and neighbouring fires become one light instead of
;              many.  3 = default; raise to merge more aggressively (fewer lights).
; min_flames : a cluster needs at least this many flames to emit a light.  1 =
;              light every fire (default).  Raise it (e.g. 25) to skip small or
;              lone fires and only light real blazes — saves light-budget slots.
enable     = 1
brightness = 1.6
radius     = 11
flicker    = 0.3
cluster    = 3
min_flames = 1

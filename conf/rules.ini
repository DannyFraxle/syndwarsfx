[engine]
;ZoomMin - The minimum zoom value. How far the game can be zoomed out.
;Lower values zoom the view out more, higher values zoom it in more.
;Default value is 145.
ZoomMin = 10

;ZoomMax - The maximum zoom value. How far the game can be zoomed in.
;Lower values zoom the view out more, higher values zoom it in more.
;Default value is 263.
ZoomMax = 160

[scanner]
; Factor of how much map area fits on the ingame scanner map.
; Valid values ranged 16..512, where 512 would make the whole map visible.
; In original game, this value was around 180 for high res mode.
BaseZoomFactor = 300
; Factor of how the user-controlled zoom level (weapon zoom) increases area visible on scanner map.
; In original game, this value was around 64 for low res mode and around 256 for high res.
UserZoomFactor = 192
; Whether the dots and circles representing things and objectives on the scanner should be sized
; to current resolution and zoom level.
ScaleDotsCircles = True

[interface]
ShowTargetHealth = True

[research]
DailyScientistDeathChancePermil = 20
ScientistsPerGroup = 4
WeaponDonateResearchIncrPermil = 125
DailyProgressRtcMinutes = 30

[revenue]
PersuadedPersonWeaponsSellCostPermil = 50

[fx3d]
AntiAliasing = 4            
; 0=off, 2/4/8
; Texture filtering (palette-correct bilinear) averages away the dark dither
; speckles SW textures use for depth (tree blossoms, brick grain) - colours
; look washed out vs the software render. False = SW-exact nearest sampling.
GroundTextureFilter = True
ObjectTextureFilter = True
SpriteTextureFilter = True

; Display frame-rate target in fps (0 = uncapped). The simulation stays at its
; native rate; extra frames present faster. Default 60.
TargetFPS = 0
; Sync buffer swaps to the monitor refresh: True = vsync on, False = off.
VSync = True
; Show an on-screen FPS / TPS (turns-per-second) readout. Default False.
ShowFPS = True
; Debug: point the mouse at a thing/building to show its Type/SubType/State/XYZ.
DebugThings = False
